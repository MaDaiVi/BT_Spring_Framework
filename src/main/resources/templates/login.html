
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập</title>

<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<script>
	function togglePassword(inputId, button) {
		const input = document.getElementById(inputId);

		if (input.type === "password") {
			input.type = "text";
			button.textContent = "Ẩn";
		} else {
			input.type = "password";
			button.textContent = "Hiện";
		}
	}
</script>
<body>

	<div class="container">
		<div class="form-box">

			<h2>CHÀO MỪNG TRỞ LẠI</h2>

			<p class="form-description">Đăng nhập để tiếp tục sử dụng hệ
				thống</p>

			<!-- Thông báo -->
			<p class="message" th:if="${message}" th:text="${message}"></p>

			<!-- Form đăng nhập -->
			<form th:action="@{/login}" method="post">

				<div class="form-group">
					<label>Tên đăng nhập</label> <input type="text" name="username"
						placeholder="Nhập tên đăng nhập" required>
				</div>

				<div class="form-group">
					<label>Mật khẩu</label>

					<div class="password-box">
						<input type="password" id="loginPassword" name="password"
							placeholder="Nhập mật khẩu" required>

						<button type="button"
							onclick="togglePassword('loginPassword', this)">Hiện</button>
					</div>
				</div>

				<button type="submit" class="btn">Đăng nhập</button>

			</form>

			<div class="form-footer">
				Chưa có tài khoản? <a th:href="@{/register}">Đăng ký ngay</a>
			</div>

		</div>
	</div>

</body>
</html>
