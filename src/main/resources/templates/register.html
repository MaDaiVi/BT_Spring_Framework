
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng ký tài khoản</title>

<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<script>
	function togglePassword(inputId, button) {
		const input = document.getElementById(inputId);

		if (input.type === "password") {
			input.type = "text";
			button.textContent = "Ẩn";
		} else {
			input.type = "password";
			button.textContent = "Hiện";
		}
	}
</script>
<body>

	<div class="container">
		<div class="form-box">

			<h2>TẠO TÀI KHOẢN</h2>

			<p class="form-description">Đăng ký để bắt đầu sử dụng hệ thống</p>

			<!-- Thông báo -->
			<p class="message" th:if="${message}" th:text="${message}"></p>

			<!-- Form đăng ký -->
			<form th:action="@{/register}" th:object="${user}" method="post">

				<div class="form-group">
					<label>Họ và tên</label> <input type="text" th:field="*{fullName}"
						placeholder="Nhập họ và tên" required>
				</div>

				<div class="form-group">
					<label>Tên đăng nhập</label> <input type="text"
						th:field="*{username}" placeholder="Nhập tên đăng nhập" required>
				</div>

				<div class="form-group">
					<label>Email</label> <input type="email" th:field="*{email}"
						placeholder="Nhập địa chỉ email" required>
				</div>

				<div class="form-group">
					<label>Mật khẩu</label>

					<div class="password-box">
						<input type="password" id="registerPassword"
							th:field="*{password}" placeholder="Nhập mật khẩu" required>

						<button type="button"
							onclick="togglePassword('registerPassword', this)">Hiện
						</button>
					</div>
				</div>

				<button type="submit" class="btn">Đăng ký</button>

			</form>

			<div class="form-footer">
				Đã có tài khoản? <a th:href="@{/login}">Đăng nhập ngay</a>
			</div>

		</div>
	</div>

</body>
</html>
